services:
  postgres:
    image: postgres:16.14
    container_name: seatly-postgres
    restart: unless-stopped
    # The H3-04 gate forks 100 clients that must all be connected at once. The
    # default max_connections is 100, which the harness alone would exhaust
    # before the application or psql got a connection.
    command:
      - postgres
      - -c
      - max_connections=200
    environment:
      POSTGRES_USER: seatly
      POSTGRES_PASSWORD: seatly
      POSTGRES_DB: seatly_dev
    ports:
      - "5432:5432"
    volumes:
      - seatly-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatly -d seatly_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  seatly-pgdata:
